spring.application.name=javacraft-platform-api
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/javacraft}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:javacraft}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:javacraft}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
