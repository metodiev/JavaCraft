services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: javacraft
      POSTGRES_USER: javacraft
      POSTGRES_PASSWORD: javacraft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javacraft -d javacraft"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/javacraft
      SPRING_DATASOURCE_USERNAME: javacraft
      SPRING_DATASOURCE_PASSWORD: javacraft
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

  sandbox-image:
    profiles: ["execution"]
    build:
      context: ./execution/sandbox
    image: javacraft-sandbox:0.1.0
    entrypoint: ["/usr/bin/true"]

  execution-worker:
    profiles: ["execution"]
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/javacraft
      SPRING_DATASOURCE_USERNAME: javacraft
      SPRING_DATASOURCE_PASSWORD: javacraft
      SPRING_PROFILES_ACTIVE: execution-worker
      APP_EXECUTION_WORKER_ENABLED: "true"
      APP_EXECUTION_DOCKER_HOST: unix:///var/run/docker.sock
      APP_EXECUTION_SANDBOX_IMAGE: javacraft-sandbox:0.1.0
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    command: ["--spring.profiles.active=execution-worker", "--app.execution.worker-enabled=true", "--spring.main.web-application-type=none"]
    group_add:
      - "${EXECUTION_DOCKER_GID:-1001}"
    volumes:
      - "${EXECUTION_DOCKER_SOCKET:-/run/user/1001/docker.sock}:/var/run/docker.sock"
    depends_on:
      db:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    restart: "on-failure:5"

volumes:
  postgres-data:
