services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: javacraft
      POSTGRES_USER: javacraft
      POSTGRES_PASSWORD: javacraft
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javacraft -d javacraft"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/javacraft
      SPRING_DATASOURCE_USERNAME: javacraft
      SPRING_DATASOURCE_PASSWORD: javacraft
      APP_CORS_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres-data:
